<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhantomClub | Catálogo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica', sans-serif; }
    body { background-color: #0f0f0f; color: #fff; padding: 15px; }
    header { text-align: center; padding: 20px 0; font-size: 24px; font-weight: bold; letter-spacing: 2px; }
    
    .grid-catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }
    
    .card-producto {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .card-producto video {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    
    .info-producto { padding: 12px; }
    .titulo { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    .precio { font-size: 16px; color: #00ff88; font-weight: bold; margin-bottom: 10px; }
    
    .btn-wsp {
      display: block;
      width: 100%;
      background-color: #25d366;
      color: #fff;
      text-align: center;
      padding: 8px 0;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header>PHANTOMCLUB</header>

  <div class="grid-catalogo">
    <!-- Tarjeta de Producto Demo -->
    <div class="card-producto">
      <video autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-fashion-model-in-a-black-outfit-40348-large.mp4" type="video/mp4">
      </video>
      <div class="info-producto">
        <p class="titulo">Prenda Phantom</p>
        <p class="precio">$00.00</p>
        <a href="https://wa.me/?text=Hola,%20me%20interesa%20esta%20prenda%20de%20PhantomClub" class="btn-wsp" target="_blank">Pedir por WhatsApp</a>
      </div>
    </div>
  </div>

</body>
</html>
